<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - SaudiCulture</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body class="auth-page">
    <header id="mainHeader">
        <div class="logo">
            <img src="images/Logo.png" alt="شعار SaudiCulture">
        </div>
        <nav>
            <a href="arabic.html">الرئيسية</a>
            <a href="login_ar.html" class="login-btn">تسجيل الدخول</a>
            <a href="signup.html" class="lang-btn">EN</a>
        </nav>
    </header>
    <div class="auth-container">
        <h2>إنشاء حساب جديد</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="الاسم " required>
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" class="auth-btn">إنشاء الحساب</button>
            <p>هل لديك حساب بالفعل؟ <a href="login_ar.html">تسجيل الدخول</a></p>
        </form>
        <p id="message" class="msg"></p>
    </div>
    <script type="module" src="JS/firebase-config.js"></script>
    <script>
        window.pageLang = "ar";</script>
    <script type="module" src="JS/auth.js"></script>
</body>

</html>
