<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - SaudiCulture</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/auth.css">
</head>

<body class="auth-page">
    <header id="mainHeader">
        <div class="logo">
            <img src="images/Logo.png" alt="شعار SaudiCulture">
        </div>
        <nav>
            <a href="arabic.html">الرئيسية</a>
            <a href="signup_ar.html" class="signup-btn">إنشاء حساب</a>
            <a href="login.html" class="lang-btn">EN</a>
        </nav>
    </header>
    <div class="auth-container">
        <h2>مرحباً بعودتك</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" class="auth-btn">تسجيل الدخول</button>
            <p>ليس لديك حساب؟ <a href="signup_ar.html">إنشاء حساب</a></p>
        </form>

        <p id="message" class="msg"></p>
    </div>

    <script type="module" src="JS/firebase-config.js"></script>
    <script>window.pageLang = "ar";</script>
    <script type="module" src="JS/auth.js"></script>
</body>

</html>
