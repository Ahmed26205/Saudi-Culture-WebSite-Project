<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - SaudiCulture</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <header id="mainHeader">
        <div class="logo">
            <!-- شعار الموقع -->
            <img src="images/Logo.png" alt="شعار SaudiCulture">
        </div>
        <!-- روابط الصفحات -->
        <nav>
            <a href="arabic.html" class="signup-btn">الرئيسية</a>
            <!-- زر انشاء الحساب -->
            <button class="signup-btn" onclick="window.location='signup_ar.html'">إنشاء حساب</button>
        </nav>
    </header>
    <!-- container لتسجيل الدخول -->
    <div class="auth-container">
        <h2>مرحباً بعودتك</h2>
        <!-- فورم تسجيل الدخول -->
        <form id="loginForm">
            <!-- ادخال الايميل -->
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <!-- ادخال كلمة المرور -->
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <!-- زر تسجيل الدخول -->
            <button type="submit" class="auth-btn">تسجيل الدخول</button>
            <!-- رابط الذهاب الى صفحة انشاء الحساب -->
            <p>ليس لديك حساب؟ <a href="signup_ar.html">إنشاء حساب</a></p>
        </form>

        <!-- رسالة نجاح/خطأ -->
        <p id="message" class="msg"></p>
    </div>

    <!-- ربط ملف اعدادات Firebase -->
    <script type="module" src="firebase-config.js"></script>
    <script>window.pageLang = "ar";</script>
    <!-- ربط ملف الأكواد الخاص بتسجيل المستخدم -->
    <script type="module" src="auth.js"></script>
</body>

</html>
