<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SaudiCulture</title>

    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header id="mainHeader">
        <div class="logo">
            <!-- الشعار الخاص بالموقع  -->
            <img src="images/Logo.png" alt="SaudiCulture Logo">
        </div>
        <nav>
            <!-- روابط الصفحة الرئيسية وتسجيل الدخول -->
            <a href="index.html" class="signup-btn">Home</a>
            <!-- زر تسجيل الدخول -->
            <button class="login-btn" onclick="window.location='login.html'">Login</button>
        </nav>
    </header>
    <!-- container التسجيل -->
    <div class="auth-container">
        <h2>Create Account</h2>
        <!-- form انشاء الحساب -->
        <form id="signupForm">
            <!-- ادخال الاسم -->
            <input type="text" id="name" placeholder="Full Name" required>
            <!-- ادخال الايميل -->
            <input type="email" id="email" placeholder="Email Address" required>
            <!-- ادخال كلمة المرور -->
            <input type="password" id="password" placeholder="Password" required>
            <!-- زر ارسال النموذج -->
            <button type="submit" class="auth-btn">Sign Up</button>
            <!-- رابط للذهاب لصفحة تسجيل الدخول -->
            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
        <!-- رسالة نجاح/خطأ -->
        <p id="message" class="msg"></p>
    </div>
    <!-- ربط ملف اعدادات Firebase -->
    <script type="module" src="firebase-config.js"></script>
    <script>window.pageLang = "en";</script>
    <!-- ربط ملف الأكواد الخاص بتسجيل المستخدم -->
    <script type="module" src="auth.js"></script>

</body>

</html>
